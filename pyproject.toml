[project]
name = "mds7202-laboratorio-programacion-cientifica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "jupyterlab>=4.5.6",
    "kaleido>=1.2.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "missingno>=0.5.2",
    "mlflow>=3.14",
    "nltk>=3.9.4",
    "numpy>=2.4.3",
    "optuna>=4.8.0",
    "pandas>=2.2,<3",
    "pillow>=12.1.1",
    "plotly>=6.6.0",
    "pre-commit>=4.5.1",
    "protobuf>=4.25,<5",
    "setuptools<81",
    "ruff>=0.15.6",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "shap>=0.51.0",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.49.0",
    "xgboost>=3.2.0",
    "optuna-integration>=4.9.0",
    "ipywidgets>=8.1.8",
    "langchain-google-genai>=4.2.7",
    "python-dotenv>=1.2.2",
    "cloudpickle>=3.1.2",
    "requests>=2.32.5",
    "gradio>=6.20.0",
]


[tool.uv]
link-mode = "copy"

[tool.uv.workspace]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: errores de estilo (indentación, espacios, etc.)
    "W",   # pycodestyle warnings: advertencias de estilo menores
    "F",   # pyflakes: imports no usados, variables indefinidas, nombres duplicados
    "I",   # isort: orden y agrupación correcta de imports
    "B",   # flake8-bugbear: patrones propensos a bugs y malas prácticas
    "UP",  # pyupgrade: modernización automática de sintaxis a Python 3.12+
]
ignore = [
    "E501", # line-too-long: largo de línea (delegado a ruff-format)
]
